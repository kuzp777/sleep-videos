<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌙 助眠视频集</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">🌙 助眠视频集</h1>
      <nav class="nav-actions">
        <button class="btn-icon" id="btn-favorites" title="收藏夹">
          <span class="icon">⭐</span>
          <span class="badge" id="fav-count" style="display:none">0</span>
        </button>
        <button class="btn-icon" id="btn-random" title="随机一个">
          <span class="icon">🎲</span>
        </button>
        <button class="btn-icon" id="btn-admin" title="管理后台" onclick="window.open('admin.html','_blank')">
          <span class="icon">⚙️</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- 搜索与筛选栏 -->
  <section class="toolbar">
    <div class="toolbar-inner">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜索视频名称、关键词…" autocomplete="off">
        <button class="btn-clear" id="btn-clear-search" style="display:none">✕</button>
      </div>
      <div class="sort-group">
        <label>排序</label>
        <select id="sort-select">
          <option value="date-desc">📅 最新优先</option>
          <option value="date-asc">📅 最早优先</option>
          <option value="name-asc">🔤 名称 A→Z</option>
          <option value="name-desc">🔤 名称 Z→A</option>
          <option value="duration-asc">⏱ 时长最短</option>
          <option value="duration-desc">⏱ 时长最长</option>
          <option value="random">🎲 随机</option>
        </select>
      </div>
    </div>
    <!-- 关键词筛选 -->
    <div class="keywords-bar" id="keywords-bar">
      <span class="kw-label">🏷️ 关键词</span>
      <div class="kw-chips" id="kw-chips"></div>
    </div>
  </section>

  <!-- 统计信息 -->
  <section class="stats-bar" id="stats-bar">
    <span id="stats-text">加载中…</span>
  </section>

  <!-- 视频网格 -->
  <main class="video-grid" id="video-grid">
    <!-- 动态生成 -->
  </main>

  <!-- 空状态 -->
  <div class="empty-state" id="empty-state" style="display:none">
    <div class="empty-icon">😴</div>
    <p>暂无视频</p>
    <p class="sub">去 <a href="admin.html">管理后台</a> 添加一些吧</p>
  </div>

  <!-- 加载状态 -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在加载…</p>
  </div>

  <!-- 视频播放弹窗 -->
  <div class="modal-overlay" id="player-modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="player-wrapper">
        <iframe id="player-iframe" src="" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div class="modal-info">
        <h3 id="modal-title"></h3>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="modal-keywords" id="modal-keywords"></div>
      </div>
    </div>
  </div>

  <!-- 随机结果弹窗 -->
  <div class="modal-overlay" id="random-modal">
    <div class="modal-content modal-small">
      <button class="modal-close" id="random-close">✕</button>
      <div class="random-result">
        <div class="random-icon">🎲</div>
        <h3 id="random-title"></h3>
        <div class="random-meta" id="random-meta"></div>
        <div class="random-actions">
          <button class="btn btn-primary" id="random-play">▶️ 播放</button>
          <button class="btn btn-secondary" id="random-another">🎲 再来一个</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>Made with 🌙 for better sleep</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
